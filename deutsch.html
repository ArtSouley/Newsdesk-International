<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NewsDesk Speedboat DE</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0d1117;--panel:#151b23;--panel2:#1b232d;
  --ink:#e7eef6;--muted:#93a3b2;--faint:#5f6d7a;
  --line:#222c37;--line2:#2c3742;
  --accent:#4a9eff;--urgent:#ff5666;--tick:#ffffff;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'IBM Plex Sans',system-ui,sans-serif;
  --boxh:calc((100vh - 98px) / 2); /* zwei volle Reihen füllen den Bildschirm; weitere Reihen scrollen */
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);display:flex;flex-direction:column;overflow:hidden;}

header{display:flex;align-items:center;gap:12px;padding:0 14px;height:42px;flex-shrink:0;background:var(--panel);border-bottom:1px solid var(--line2);}
.logo{font-family:var(--mono);font-weight:600;font-size:0.72rem;letter-spacing:0.22em;color:var(--accent);}
.sep{width:1px;height:16px;background:var(--line2);}
#clock{font-family:var(--mono);font-size:0.72rem;color:var(--muted);font-variant-numeric:tabular-nums;}
.live{font-family:var(--mono);font-size:0.56rem;color:var(--urgent);letter-spacing:0.18em;display:flex;align-items:center;gap:5px;}
.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--urgent);animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.header-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
#load-status{font-family:var(--mono);font-size:0.6rem;color:var(--muted);white-space:nowrap;}
.btn{font-family:var(--mono);font-size:0.58rem;padding:4px 11px;background:var(--panel2);border:1px solid var(--line2);color:var(--muted);cursor:pointer;border-radius:5px;transition:all .15s;}
.btn:hover{border-color:var(--accent);color:var(--accent);}

.ticker{display:flex;align-items:center;height:26px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0;}
.ticker-left{display:flex;align-items:center;gap:7px;padding:0 12px;flex-shrink:0;}
#search-box{font-family:var(--mono);font-size:0.6rem;padding:3px 9px;background:var(--panel2);border:1px solid var(--line2);color:var(--ink);border-radius:5px;width:170px;outline:none;}
#search-box:focus{border-color:var(--accent);}
#search-count{font-family:var(--mono);font-size:0.52rem;color:var(--faint);white-space:nowrap;}
.ticker-lbl{font-family:var(--mono);font-size:0.52rem;font-weight:600;color:#fff;background:var(--accent);padding:0 11px;height:100%;display:flex;align-items:center;letter-spacing:0.16em;}
.ticker-track{flex:1;overflow:hidden;}
.ticker-txt{display:inline-block;white-space:nowrap;font-family:var(--mono);font-size:0.7rem;color:var(--tick);animation:scroll 80s linear infinite;padding-left:100%;}
.ticker-txt:hover{animation-play-state:paused;}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-100%)}}

/* Alles in EIN Raster – TOP ist eine gleich große Kachel, bricht in Reihen um, scrollt als Ganzes */
.columns-wrap{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));grid-auto-rows:var(--boxh);gap:10px;padding:10px;overflow-y:auto;align-content:start;min-height:0;scrollbar-width:thin;scrollbar-color:var(--line2) transparent;}
.columns-wrap::-webkit-scrollbar{width:6px;}
.columns-wrap::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px;}
.col{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden;min-height:0;}
.top-box .col-name{color:var(--urgent);}
.col-head{padding:8px 12px;background:var(--panel2);border-bottom:1px solid var(--line);font-family:var(--mono);font-size:0.6rem;font-weight:600;letter-spacing:0.14em;flex-shrink:0;display:flex;align-items:center;gap:8px;min-height:31px;}
.col-name{flex:1;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.src-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.col-count{color:var(--faint);font-weight:400;background:var(--bg);padding:1px 7px;border-radius:9px;}
.col-items{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line2) transparent;}
.col-items::-webkit-scrollbar{width:5px;}
.col-items::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px;}
.col-msg{padding:16px 12px;font-family:var(--mono);font-size:0.58rem;color:var(--faint);text-align:center;}

.item{display:block;text-decoration:none;position:relative;padding:6px 10px 6px 15px;border-bottom:1px solid var(--line);transition:background .12s;-webkit-user-select:text;user-select:text;}
.item::before{content:"";position:absolute;left:0;top:5px;bottom:5px;width:3px;border-radius:2px;background:var(--barc,var(--faint));}
.item:hover{background:var(--panel2);}
.item-meta{font-family:var(--mono);font-size:0.52rem;color:var(--muted);margin-bottom:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.item-src{font-weight:600;color:var(--srcc,var(--muted));}
.item-time{color:var(--faint);}
.item-title{font-size:0.71rem;line-height:1.28;color:var(--ink);font-weight:500;}
.item:hover .item-title{color:var(--accent);}
.item.urgent::before{background:var(--urgent);}
.item.urgent .item-title{color:var(--urgent);font-weight:700;}
.item.urgent .item-src{color:var(--urgent);}
.item:hover.urgent .item-title{color:var(--urgent);}
.item.sel{background:var(--panel2);box-shadow:inset 0 0 0 2px var(--accent);border-radius:4px;}

.badge{display:inline-block;background:var(--urgent);color:#fff;font-weight:600;padding:1px 6px;border-radius:9px;font-size:0.56rem;font-family:var(--mono);}

@media(max-width:760px){
  .columns-wrap{grid-template-columns:1fr;grid-auto-rows:340px;}
}
</style>
</head>
<body>

<header>
  <div class="logo">▸ NEWSDESK SPEEDBOAT DE</div>
  <div class="sep"></div>
  <div id="clock">--:--:--</div>
  <div class="sep"></div>
  <div class="live">LIVE</div>
  <div class="header-right">
    <span id="load-status"></span>
    <button class="btn" onclick="refreshAll()">⟳ REFRESH</button>
  </div>
</header>

<div class="ticker">
  <div class="ticker-left">
    <input type="text" id="search-box" placeholder="Suche… (auch Quelle, z. B. WELT)" oninput="render()">
    <span id="search-count"></span>
  </div>
  <div class="ticker-lbl">AKTUELL</div>
  <div class="ticker-track"><span class="ticker-txt" id="ticker-txt">Lädt…</span></div>
</div>
<div class="columns-wrap" id="columns"></div>

<script>
const FEEDS = [
  {name:'SPIEGEL',    url:'https://www.spiegel.de/schlagzeilen/index.rss'},
  {name:'BILD',       url:'https://www.bild.de/rss-feeds/rss-16725492,feed=home.bild.html'},
  {name:'T-ONLINE',   url:'https://www.t-online.de/feed.rss',
                      merge:['https://www.t-online.de/schlagzeilen/feed.rss',
                             'https://www.t-online.de/nachrichten/feed.rss']},
  {name:'DTS',        url:'https://www.finanznachrichten.de/rss-nachrichten-medien-dts-nachrichtenagentur'},
  {name:'NTV',        url:'https://www.n-tv.de/home/Das_Neueste/rss'},
  {name:'DLF',        url:'https://www.deutschlandfunk.de/die-nachrichten.353.de.rss'},
  {name:'EURONEWS',   url:'https://de.euronews.com/rss?format=mrss&level=theme&name=news'},
  {name:'WELT',       url:'https://www.welt.de/feeds/latest.rss'},
  {name:'Tagesspiegel',url:'https://www.tagesspiegel.de/contentexport/feed/home'},
  {name:'RND',        url:'https://www.rnd.de/arc/outboundfeeds/rss/category/politik/',
                      merge:['https://www.rnd.de/arc/outboundfeeds/rss/category/wirtschaft/',
                             'https://www.rnd.de/arc/outboundfeeds/rss/category/panorama/']},
  {name:'Tagesschau', url:'https://www.tagesschau.de/xml/rss2'},
  {name:'SZ',         url:'https://rss.sueddeutsche.de/rss/Topthemen',
                      alt:['https://rss.sueddeutsche.de/app/service/rss/alles/index.rss?output=rss',
                           'https://www.sueddeutsche.de/news/rss']},
  {name:'ZEIT',       url:'https://newsfeed.zeit.de/all'},
];

// Feste Balken-/Quellenfarbe je Quelle
const SRC = {
  'SPIEGEL':'#5b9dff','BILD':'#fb923c','T-ONLINE':'#34d399','DTS':'#e0a63c',
  'NTV':'#f472b6','DLF':'#a78bfa','EURONEWS':'#22c3e6','WELT':'#a3e635','Tagesspiegel':'#2dd4bf',
  'RND':'#818cf8','Tagesschau':'#2563eb','SZ':'#facc15','ZEIT':'#f87171','BI DE':'#fca5a5'
};

const data = FEEDS.map(f=>({...f, items:[], status:'pending'}));

// Hintergrund-Quellen: fließen NUR in die TOP-Spalte (kein eigenes Kästchen)
const EXTRA_FEEDS = [
  {name:'Google News', url:'https://news.google.com/rss?hl=de&gl=DE&ceid=DE:de'},
  {name:'BI DE',       url:'https://www.businessinsider.de/feed/businessinsider-alle-artikel'},
  {name:'FAZ',         url:'https://www.faz.net/rss/aktuell'},
  {name:'Handelsblatt',url:'https://www.handelsblatt.com/contentexport/feed/schlagzeilen'},
  {name:'RP Online',   url:'https://rp-online.de/feed.rss'},
  {name:'RND',         url:'https://www.rnd.de/arc/outboundfeeds/rss/'},
];
const extra = EXTRA_FEEDS.map(f=>({...f, items:[], status:'pending'}));
let loadedCount = 0;

setInterval(()=>{
  const n=new Date(), p=x=>String(x).padStart(2,'0');
  document.getElementById('clock').textContent=
    `${p(n.getHours())}:${p(n.getMinutes())}:${p(n.getSeconds())} MEZ · `+
    n.toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'short'});
},1000);

function parseXML(xml) {
  try {
    const doc = new DOMParser().parseFromString(xml, 'text/xml');
    const items = [...doc.querySelectorAll('item,entry')].slice(0,50).map((el, idx)=>{
      const title = (el.querySelector('title')?.textContent || '').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
      const link  = el.querySelector('link')?.textContent?.trim() || el.querySelector('link')?.getAttribute('href') || '#';
      const pub   = (el.querySelector('pubDate,published,updated')?.textContent
                     || [...el.children].find(c=>/date/i.test(c.tagName))?.textContent
                     || '').trim();
      const raw = pub ? new Date(pub) : null;
      let date, est=false;
      if(raw && !isNaN(raw.getTime())){ date = raw; }
      else { date = new Date(Date.now() - idx*60000); est = true; } // kein/ungültiges Datum (z. B. BILD) → nach Feed-Reihenfolge oben, ohne Zeitangabe
      return {title, link, pub, date, est};
    });
    return items.filter(i=>i.title.length>3);
  } catch(e) { return []; }
}

async function fetchFeed(url) {
  const strategies = [
    async () => { const r = await fetch(`https://speedboatnat.sartiisik.workers.dev/?url=${encodeURIComponent(url)}`, {signal:AbortSignal.timeout(15000)}); return r.ok ? await r.text() : null; },
    async () => { const r = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`, {signal:AbortSignal.timeout(15000)}); return r.ok ? await r.text() : null; },
    async () => { const r = await fetch(`https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(url)}`, {signal:AbortSignal.timeout(15000)}); return r.ok ? await r.text() : null; },
    async () => { const r = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`, {signal:AbortSignal.timeout(15000)}); if(!r.ok) return null; const j = await r.json(); return j && j.contents ? j.contents : null; },
    async () => { const r = await fetch(`https://corsproxy.io/?url=${encodeURIComponent(url)}`, {signal:AbortSignal.timeout(12000)}); return r.ok ? await r.text() : null; },
    async () => { const r = await fetch(url, {signal:AbortSignal.timeout(10000)}); return r.ok ? await r.text() : null; },
  ];
  for (const strat of strategies) {
    try { const text = await strat(); if (text) { const items = parseXML(text); if (items.length > 0) return items; } } catch(e) {}
  }
  // rss2json – holt den Feed serverseitig (greift oft, wo Proxys geblockt werden, z. B. t-online)
  try {
    const r = await fetch(`https://api.rss2json.com/v1/api.json?count=50&rss_url=${encodeURIComponent(url)}`, {signal:AbortSignal.timeout(12000)});
    if (r.ok) {
      const j = await r.json();
      if (j && j.status === 'ok' && Array.isArray(j.items) && j.items.length) {
        return j.items.slice(0,50).map((it, idx)=>{
          const raw = it.pubDate ? new Date(it.pubDate) : null;
          let date, est=false;
          if(raw && !isNaN(raw.getTime())){ date = raw; }
          else { date = new Date(Date.now() - idx*60000); est = true; }
          return {
            title: (it.title||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim(),
            link:  it.link || '#',
            pub:   it.pubDate || '',
            date, est
          };
        }).filter(i=>i.title.length>3);
      }
    }
  } catch(e) {}
  return null;
}

// Clustering: gleiche Story über mehrere Quellen erkennen und als "TOP"-Spalte bündeln
const STOP = new Set(['about','after','again','could','would','should','their','there','these','those','which','while','where','being','first','still','three','under','since','other','against','among','because','before','during','people','minister','president',
'einen','gegen','nicht','werden','haben','wegen','immer','schon','wieder','sollte','koennte','wurde','worden','diese','dieser','einem','einer','durch','zwischen','mehr','sein']);
function sigWords(t){
  return (t||'').toLowerCase()
    .replace(/[^a-zäöüßàâçéèêëîïôûùüÿñæœ0-9\s]/g,' ')
    .split(/\s+/).filter(w=>w.length>=5 && !STOP.has(w));
}
function topClusters(){
  const all=[];
  data.concat(extra).forEach(f=>{ if(f.status==='ok') f.items.forEach(i=>all.push({title:i.title,link:i.link,date:i.date,est:i.est,src:f.name,words:sigWords(i.title)})); });
  all.sort((a,b)=>b.date-a.date);
  const clusters=[];
  for(const it of all){
    if(it.words.length<2) continue;
    let best=null,bestShared=0;
    for(const c of clusters){
      let shared=0; for(const w of it.words) if(c.wordset.has(w)) shared++;
      if(shared>bestShared){ bestShared=shared; best=c; }
    }
    if(best && bestShared>=2){
      best.sources.add(it.src);
      it.words.forEach(w=>best.wordset.add(w));
    } else {
      clusters.push({title:it.title,link:it.link,date:it.date,est:it.est,src:it.src,sources:new Set([it.src]),wordset:new Set(it.words)});
    }
  }
  // "Hotness": viele Quellen zählen, aber Frische stark – nur Storys der letzten Stunde;
  // wird 1 Std. lang nichts Neues gemeldet, fällt das Thema ganz raus.
  const now = Date.now();
  const ageH = c => Math.max(0,(now - c.date.getTime())/3600000);
  const hot  = c => c.sources.size / Math.pow(ageH(c) + 2, 2.3);
  return clusters.filter(c=>c.sources.size>=2 && ageH(c) <= 1).sort((a,b)=> hot(b)-hot(a));
}
function topColumnHTML(q){
  let cl = topClusters();
  if(q) cl = cl.filter(c=>c.title.toLowerCase().includes(q) || [...c.sources].some(s=>s.toLowerCase().includes(q)));
  const body = cl.length ? cl.map(c=>{
    const n=c.sources.size, full=[...c.sources].join(', '), bc=SRC[c.src]||'var(--faint)';
    return `<a class="item${isUrgent(c.title)?' urgent':''}" href="${c.link}" target="_blank" rel="noopener" draggable="false" style="--barc:${bc}">
      <div class="item-meta"><span class="badge" title="${esc(full)}">×${n}</span><span class="item-time">${c.est ? '' : timeAgo(c.date)}</span></div>
      <div class="item-title">${esc(c.title)}</div></a>`;
  }).join('') : `<div class="col-msg">Noch keine Mehrfach-Meldung</div>`;
  return `<div class="col box top-box">
    <div class="col-head"><span class="src-dot" style="background:var(--urgent)"></span><span class="col-name">▲ TOP</span><span class="col-count">${cl.length||''}</span></div>
    <div class="col-items">${body}</div>
  </div>`;
}

// Ein Kästchen je Quelle: zeigt nur die Meldungen dieser Quelle, neueste zuerst, einzeln scrollbar
function boxItem(i){
  const c = SRC[i.src] || 'var(--faint)';
  const t = i.est ? '' : timeAgo(i.date);
  return `<a class="item${isUrgent(i.title)?' urgent':''}" href="${i.link}" target="_blank" rel="noopener" draggable="false" style="--barc:${c}">
    ${t ? `<div class="item-meta"><span class="item-time">${t}</span></div>` : ''}
    <div class="item-title">${esc(i.title)}</div>
  </a>`;
}
function boxHTML(feed, q){
  let items = feed.status==='ok' ? feed.items : [];
  const nameHit = (feed.name||'').toLowerCase().includes(q);
  if(q) items = items.filter(i=>i.title.toLowerCase().includes(q) || nameHit);
  if(q && !items.length) return '';            // bei Suche leere Kästchen ausblenden
  const color = SRC[feed.name] || 'var(--faint)';
  const body = items.length ? items.map(i=>boxItem({...i,src:feed.name})).join('')
    : (feed.status==='loading'||feed.status==='pending' ? `<div class="col-msg">⟳ lädt…</div>`
       : feed.status==='fail' ? `<div class="col-msg">– offline</div>` : `<div class="col-msg">–</div>`);
  return `<div class="col box">
    <div class="col-head"><span class="src-dot" style="background:${color}"></span><span class="col-name" style="color:${color}">${esc(feed.name)}</span><span class="col-count">${items.length||''}</span></div>
    <div class="col-items">${body}</div>
  </div>`;
}

function render() {
  const q = document.getElementById('search-box') ? document.getElementById('search-box').value.toLowerCase().trim() : '';
  const boxes = data.map(f=>boxHTML(f,q)).join('');
  document.getElementById('columns').innerHTML =
    topColumnHTML(q) + boxes;
  const sc = document.getElementById('search-count');
  if(sc){
    if(q){
      let total=0;
      data.forEach(f=>{ if(f.status==='ok'){ const nh=f.name.toLowerCase().includes(q); total += f.items.filter(i=>i.title.toLowerCase().includes(q)||nh).length; } });
      sc.textContent = `${total} Treffer`;
    } else sc.textContent = '';
  }
  navApply(false);
}

async function loadFeed(feed) {
  feed.status = 'loading'; render();
  try {
    let items = await fetchFeed(feed.url);
    // Ersatz-Adressen probieren, falls die Haupt-URL nichts liefert
    if ((!items || !items.length) && feed.alt) {
      for (const u of feed.alt) {
        items = await fetchFeed(u);
        if (items && items.length) break;
      }
    }
    // Zusatz-Feeds derselben Quelle dazumischen (z. B. t-online Schlagzeilen + Nachrichten)
    if (feed.merge && feed.merge.length) {
      for (const u of feed.merge) {
        try { const ex = await fetchFeed(u); if (ex && ex.length) items = (items||[]).concat(ex); } catch(e) {}
      }
    }
    if (!items || items.length === 0) throw new Error('no items');
    // Dubletten anhand des Titels entfernen
    const seen = new Set();
    items = items.filter(i=>{ const k=i.title.toLowerCase().slice(0,60); if(seen.has(k)) return false; seen.add(k); return true; });
    items.sort((a, b) => b.date - a.date);
    feed.items  = items.slice(0,60);
    feed.status = 'ok';
  } catch(e) {
    feed.status = 'fail';
  }
  loadedCount++;
  const ok = data.filter(f=>f.status==='ok').length;
  const failed = data.filter(f=>f.status==='fail').map(f=>f.name);
  document.getElementById('load-status').textContent =
    loadedCount < data.length ? `${loadedCount}/${data.length}…`
      : `✓ ${ok} von ${data.length}` + (failed.length ? ` · fehlt: ${failed.join(', ')}` : ' aktiv');
  const latest = data.filter(f=>f.status==='ok'&&f.items[0]).map(f=>`[${f.name}] ${f.items[0].title}`);
  if (latest.length) document.getElementById('ticker-txt').textContent = latest.join('   //   ');
  render();
}

// Drossel: immer nur wenige Feeds gleichzeitig, sonst drosseln die Gratis-Proxys alles weg
async function runPool(items, limit, worker){
  let i = 0;
  const run = async () => { while(i < items.length){ const idx = i++; await worker(items[idx]); } };
  await Promise.all(Array.from({length: Math.min(limit, items.length)}, run));
}

// Hintergrund-Quelle laden: nur Items sammeln (für TOP), kein eigenes Kästchen
async function loadExtra(feed){
  try{
    let items = await fetchFeed(feed.url);
    if((!items||!items.length) && feed.alt){ for(const u of feed.alt){ items=await fetchFeed(u); if(items&&items.length) break; } }
    feed.items = (items&&items.length)? items.slice(0,60) : [];
  }catch(e){ feed.items=[]; }
  feed.status = feed.items.length ? 'ok' : 'fail';
  render();
}

async function refreshAll() {
  loadedCount = 0;
  data.forEach(f=>{f.items=[];f.status='pending';});
  extra.forEach(f=>{f.items=[];f.status='pending';});
  document.getElementById('load-status').textContent = 'lädt…';
  render();
  await Promise.all([ runPool(data, 6, loadFeed), runPool(extra, 6, loadExtra) ]);
}

// Markieren ohne Öffnen: ist Text ausgewählt, zählt das Loslassen nicht als Link-Klick
document.getElementById('columns').addEventListener('click', e=>{
  const a = e.target.closest('a.item');
  if(!a) return;
  const sel = window.getSelection();
  if(sel && !sel.isCollapsed && sel.toString().trim().length>0) e.preventDefault();
});

// Tastatur-Navigation: Pfeiltasten bewegen den Auswahl-Balken (←/→ Kachel, ↑/↓ Meldung), Enter öffnet
let selCol = 0, selRow = 0, navActive = false;
function navCols(){ return [...document.querySelectorAll('#columns .col')]; }
function navItems(ci){ const c = navCols()[ci]; return c ? [...c.querySelectorAll('a.item')] : []; }
function navApply(scroll){
  document.querySelectorAll('a.item.sel').forEach(e=>e.classList.remove('sel'));
  if(!navActive) return;
  const cs = navCols(); if(!cs.length) return;
  selCol = Math.max(0, Math.min(selCol, cs.length-1));
  const items = navItems(selCol); if(!items.length) return;
  selRow = Math.max(0, Math.min(selRow, items.length-1));
  const el = items[selRow];
  if(el){ el.classList.add('sel'); if(scroll) navScroll(el); }
}
function navScroll(el){
  const box = el.closest('.col-items'); if(!box) return;
  const items = [...box.querySelectorAll('a.item')];
  if(items[0]===el){ box.scrollTop=0; return; }
  const er = el.getBoundingClientRect(), br = box.getBoundingClientRect();
  if(er.bottom > br.bottom){ box.scrollTop += (er.top - br.top) - 6; }
  else if(er.top < br.top){ box.scrollTop += (er.bottom - br.bottom) + 6; }
  el.scrollIntoView({block:'nearest',inline:'nearest'});
}
function navMove(dCol, dRow){
  const cs = navCols(); if(!cs.length) return;
  if(dCol){
    let nc = selCol;
    for(let k=0;k<cs.length;k++){ nc=(nc+dCol+cs.length)%cs.length; if(navItems(nc).length){ selCol=nc; break; } }
    selRow = Math.min(selRow, Math.max(0, navItems(selCol).length-1));
  }
  if(dRow){ const len=navItems(selCol).length; if(len) selRow=(selRow+dRow+len)%len; }
  navApply(true);
}
window.addEventListener('keydown', e=>{
  const sb=document.getElementById('search-box');
  const tag=(e.target.tagName||'').toLowerCase();
  if((tag==='input'||tag==='textarea') && !(e.target===sb && sb && sb.value==='')) return;
  if(e.key==='Enter'){
    if(!navActive) return;
    const el=navItems(selCol)[selRow];
    if(el){ e.preventDefault(); window.open(el.href,'_blank','noopener'); }
    return;
  }
  const dirs={ArrowRight:[1,0],ArrowLeft:[-1,0],ArrowDown:[0,1],ArrowUp:[0,-1]};
  if(!(e.key in dirs)) return;
  e.preventDefault();
  if(!navActive){
    navActive=true;
    const cs=navCols(); selCol=0; selRow=0;
    for(let i=0;i<cs.length;i++){ if(navItems(i).length){ selCol=i; break; } }
    navApply(true);
    return;
  }
  navMove(dirs[e.key][0], dirs[e.key][1]);
});
function navRefocus(){
  const cols=document.getElementById('columns');
  const sb=document.getElementById('search-box');
  if(sb && document.activeElement===sb) sb.blur();
  if(cols){ cols.tabIndex=-1; cols.style.outline='none'; try{ cols.focus({preventScroll:true}); }catch(e){ try{ cols.focus(); }catch(_){} } }
  if(navActive) navApply(false);
}
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ navRefocus(); setTimeout(navRefocus,80); } });
window.addEventListener('focus', ()=>{ navRefocus(); setTimeout(navRefocus,80); });
window.addEventListener('pageshow', navRefocus);

refreshAll();
setInterval(refreshAll, 120000);

function timeAgo(d) {
  if(!d || !(d instanceof Date) || isNaN(d.getTime())) return '';
  const m = Math.floor((Date.now() - d.getTime())/60000);
  if(isNaN(m)||m<0) return '';
  if(m<2)    return 'eben';
  if(m<60)   return `${m} Min.`;
  if(m<1440) return `${Math.floor(m/60)} Std.`;
  return `${Math.floor(m/1440)}d`;
}
// Relevanz-Flag: Dringlichkeits-/Exklusiv-Wörter → ganze Schlagzeile rot
const URGENT = /(\bEilmeldung|\bEil\b|\bBreaking|\bExklusiv)/i;
function isUrgent(t){ return URGENT.test(t||''); }
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
</script>
