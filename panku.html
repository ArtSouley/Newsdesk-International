<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NewsDesk Speedboat PAN/KU</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0d1117;--panel:#151b23;--panel2:#1b232d;
  --ink:#e7eef6;--muted:#93a3b2;--faint:#5f6d7a;
  --line:#222c37;--line2:#2c3742;
  --accent:#4a9eff;--urgent:#ff5666;--tick:#ffffff;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'IBM Plex Sans',system-ui,sans-serif;
  --boxh:calc((100vh - 98px) / 2); /* zwei volle Reihen füllen den Bildschirm; weitere Reihen scrollen */
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);display:flex;flex-direction:column;overflow:hidden;}

header{display:flex;align-items:center;gap:12px;padding:0 14px;height:42px;flex-shrink:0;background:var(--panel);border-bottom:1px solid var(--line2);}
.logo{font-family:var(--mono);font-weight:600;font-size:0.72rem;letter-spacing:0.22em;color:var(--accent);}
.sep{width:1px;height:16px;background:var(--line2);}
#clock{font-family:var(--mono);font-size:0.72rem;color:var(--muted);font-variant-numeric:tabular-nums;}
.live{font-family:var(--mono);font-size:0.56rem;color:var(--urgent);letter-spacing:0.18em;display:flex;align-items:center;gap:5px;}
.live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--urgent);animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.header-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
#load-status{font-family:var(--mono);font-size:0.6rem;color:var(--muted);white-space:nowrap;}
.btn{font-family:var(--mono);font-size:0.58rem;padding:4px 11px;background:var(--panel2);border:1px solid var(--line2);color:var(--muted);cursor:pointer;border-radius:5px;transition:all .15s;}
.btn:hover{border-color:var(--accent);color:var(--accent);}

.ticker{display:flex;align-items:center;height:26px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0;}
.ticker-left{display:flex;align-items:center;gap:7px;padding:0 12px;flex-shrink:0;}
#search-box{font-family:var(--mono);font-size:0.6rem;padding:3px 9px;background:var(--panel2);border:1px solid var(--line2);color:var(--ink);border-radius:5px;width:200px;outline:none;}
#search-box:focus{border-color:var(--accent);}
#search-count{font-family:var(--mono);font-size:0.52rem;color:var(--faint);white-space:nowrap;}
.ticker-lbl{font-family:var(--mono);font-size:0.52rem;font-weight:600;color:#fff;background:var(--accent);padding:0 11px;height:100%;display:flex;align-items:center;letter-spacing:0.16em;}
.ticker-track{flex:1;overflow:hidden;}
.ticker-txt{display:inline-block;white-space:nowrap;font-family:var(--mono);font-size:0.7rem;color:var(--tick);animation:scroll 80s linear infinite;padding-left:100%;}
.ticker-txt:hover{animation-play-state:paused;}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-100%)}}

/* Alles in EIN Raster – TOP ist eine gleich große Kachel, bricht in Reihen um, scrollt als Ganzes */
.columns-wrap{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));grid-auto-rows:var(--boxh);gap:10px;padding:10px;overflow-y:auto;align-content:start;min-height:0;scrollbar-width:thin;scrollbar-color:var(--line2) transparent;}
.columns-wrap::-webkit-scrollbar{width:6px;}
.columns-wrap::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px;}
.col{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden;min-height:0;}
.top-box .col-name{color:var(--urgent);}
.col-head{padding:8px 12px;background:var(--panel2);border-bottom:1px solid var(--line);font-family:var(--mono);font-size:0.6rem;font-weight:600;letter-spacing:0.14em;flex-shrink:0;display:flex;align-items:center;gap:8px;min-height:31px;}
.col-name{flex:1;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.src-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.col-count{color:var(--faint);font-weight:400;background:var(--bg);padding:1px 7px;border-radius:9px;}
.col-items{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line2) transparent;}
.col-items::-webkit-scrollbar{width:5px;}
.col-items::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px;}
.col-msg{padding:16px 12px;font-family:var(--mono);font-size:0.58rem;color:var(--faint);text-align:center;}

.item{display:block;text-decoration:none;position:relative;padding:6px 10px 6px 15px;border-bottom:1px solid var(--line);transition:background .12s;-webkit-user-select:text;user-select:text;}
.item::before{content:"";position:absolute;left:0;top:5px;bottom:5px;width:3px;border-radius:2px;background:var(--barc,var(--faint));}
.item:hover{background:var(--panel2);}
.item-meta{font-family:var(--mono);font-size:0.52rem;color:var(--muted);margin-bottom:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.item-src{font-weight:600;color:var(--srcc,var(--muted));}
.item-time{color:var(--faint);}
.item-title{font-size:0.71rem;line-height:1.28;color:var(--ink);font-weight:500;}
.item:hover .item-title{color:var(--accent);}
.item.urgent::before{background:var(--urgent);}
.item.urgent .item-title{color:var(--urgent);font-weight:700;}
.item.urgent .item-src{color:var(--urgent);}
.item:hover.urgent .item-title{color:var(--urgent);}
.item.sel{background:var(--panel2);box-shadow:inset 0 0 0 2px var(--accent);border-radius:4px;}

.badge{display:inline-block;background:var(--urgent);color:#fff;font-weight:600;padding:1px 6px;border-radius:9px;font-size:0.56rem;font-family:var(--mono);}

@media(max-width:760px){
  .columns-wrap{grid-template-columns:1fr;grid-auto-rows:340px;}
}
</style>
</head>
<body>

<header>
  <div class="logo">▸ NEWSDESK SPEEDBOAT PAN/KU</div>
  <div class="sep"></div>
  <div id="clock">--:--:--</div>
  <div class="sep"></div>
  <div class="live">LIVE</div>
  <div class="header-right">
    <span id="load-status"></span>
    <button class="btn" onclick="refreshAll()">⟳ REFRESH</button>
  </div>
</header>

<div class="ticker">
  <div class="ticker-left">
    <input type="text" id="search-box" placeholder="Suche… (auch Quelle, z. B. TMZ)" oninput="render()">

  </div>
  <div class="ticker-lbl">AKTUELL</div>
  <div class="ticker-track"><span class="ticker-txt" id="ticker-txt">Lädt…</span></div>
</div>
<div class="columns-wrap" id="columns"></div>
