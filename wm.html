<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NewsDesk Speedboat WM 2026</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0c0f;--bg2:#0f1318;--panel:#111518;--border:#1c2530;--border2:#243040;--accent:#e8a020;--red:#e04455;--text:#ccd8e0;--text2:#7a9aaa;--dim:#354555;--mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--sans);}
body{display:flex;flex-direction:column;}

header{display:flex;align-items:center;gap:12px;padding:0 16px;height:40px;flex-shrink:0;background:var(--bg2);border-bottom:2px solid var(--accent);}
.logo{font-family:var(--mono);font-weight:600;font-size:0.72rem;letter-spacing:0.2em;color:var(--accent);white-space:nowrap;}
.sep{width:1px;height:18px;background:var(--border2);}
#clock{font-family:var(--mono);font-size:0.7rem;color:var(--accent);white-space:nowrap;}
.live{font-family:var(--mono);font-size:0.56rem;color:var(--red);letter-spacing:0.2em;animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.header-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
#load-status{font-family:var(--mono);font-size:0.58rem;color:var(--accent);white-space:nowrap;}
.btn{font-family:var(--mono);font-size:0.56rem;padding:3px 10px;background:transparent;border:1px solid var(--border2);color:var(--text2);cursor:pointer;border-radius:2px;transition:all .2s;white-space:nowrap;}
.btn:hover{border-color:var(--accent);color:var(--accent);}

.columns-wrap{flex:1;display:flex;gap:1px;background:var(--border);overflow:hidden;min-height:0;}
.col{flex:1;display:flex;flex-direction:column;background:var(--panel);overflow:hidden;min-width:0;}
.col-head{padding:8px 11px;background:var(--bg2);border-bottom:1px solid var(--border);border-top:2px solid var(--accent);font-family:var(--mono);font-size:0.66rem;font-weight:600;letter-spacing:0.12em;flex-shrink:0;display:flex;align-items:center;}
.col-name{flex:1;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.col-count{color:var(--dim);font-weight:400;padding-left:6px;}
.col-items{flex:1;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
.col-items::-webkit-scrollbar{width:3px;}
.col-items::-webkit-scrollbar-thumb{background:var(--border2);}
.col-msg{padding:16px 12px;font-family:var(--mono);font-size:0.58rem;color:var(--dim);text-align:center;animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}

.item{display:block;text-decoration:none;padding:9px 11px;border-bottom:1px solid var(--border);transition:background .12s;}
.item:hover{background:rgba(232,160,32,.07);}
.item:hover .item-title{color:var(--accent);}
.item-src{font-family:var(--mono);font-size:0.56rem;color:var(--accent);margin-bottom:3px;letter-spacing:0.04em;}
.item-src .ago{color:var(--text2);}
.item-title{font-size:0.79rem;line-height:1.46;color:var(--text);transition:color .12s;}

.ticker{display:flex;align-items:center;height:22px;background:var(--bg2);border-top:1px solid var(--border2);overflow:hidden;flex-shrink:0;}
.ticker-lbl{font-family:var(--mono);font-size:0.52rem;font-weight:600;color:var(--bg);background:var(--accent);padding:0 10px;height:100%;display:flex;align-items:center;letter-spacing:0.14em;flex-shrink:0;}
.ticker-track{flex:1;overflow:hidden;}
.ticker-txt{display:inline-block;white-space:nowrap;font-family:var(--mono);font-size:0.75rem;color:var(--accent);animation:scroll 60s linear infinite;}
.ticker-txt:hover{animation-play-state:paused;}
@keyframes scroll{from{transform:translateX(100vw)}to{transform:translateX(-100%)}}
</style>
</head>
<body>

<header>
  <div class="logo">▸ NEWSDESK · WM 2026</div>
  <div class="sep"></div>
  <div id="clock">--:--:--</div>
  <div class="sep"></div>
  <div class="live">● LIVE</div>
  <div class="sep"></div>
  <input type="text" id="search-box" placeholder="Suche (alle Spalten)…" oninput="render()"
    style="font-family:var(--mono);font-size:0.56rem;padding:2px 8px;background:var(--panel);border:1px solid var(--border2);color:var(--text);border-radius:2px;width:160px;outline:none;height:20px;">
  <div class="header-right">
    <span id="load-status"></span>
    <button class="btn" onclick="refreshAll()">⟳ REFRESH</button>
  </div>
</header>

<div class="columns-wrap" id="columns"></div>

<script>
// Google-News-Suchfeed des Landes (WM + Nationalelf) – als Quelle und Ersatz.
const GN = (q, hl='de', gl='DE') => `https://news.google.com/rss/search?q=${q}&hl=${hl}&gl=${gl}&ceid=${gl}:${hl.split('-')[0]}`;

// Eine Spalte pro Land. Alle Feeds der Spalte werden zu EINEM Strom gemischt.
const COLUMNS = [
  { label:'DT MEDIEN', feeds:[
    {name:'GoogleNews',  urls:[GN('Fussball-WM%202026%20OR%20DFB','de','DE')]},
    {name:'kicker',      urls:['https://newsfeed.kicker.de/news/fussball','https://newsfeed.kicker.de/news/aktuell']},
    {name:'Sportschau',  urls:['https://www.sportschau.de/fussball/index~rss2.xml']},
    {name:'Spiegel',     urls:['https://www.spiegel.de/sport/index.rss']},
    {name:'Sport1',      urls:[GN('site:sport1.de%20WM%20OR%20DFB%20OR%20Fussball','de','DE')]},
    {name:'Spox',        urls:['https://www.spox.com/pub/rss/fussball.xml','https://www.spox.com/pub/rss/sport.xml']},
  ]},
  { label:'US MEDIEN', feeds:[
    {name:'GoogleNews',  urls:[GN('World%20Cup%202026%20OR%20USMNT','en-US','US')]},
    {name:'ESPN',        urls:['https://www.espn.com/espn/rss/soccer/news']},
    {name:'NYT',         urls:['https://rss.nytimes.com/services/xml/rss/nyt/Soccer.xml']},
    {name:'Yahoo',       urls:['https://sports.yahoo.com/soccer/rss/']},
  ]},
  { label:'ENG MEDIEN', feeds:[
    {name:'GoogleNews',  urls:[GN('World%20Cup%202026%20OR%20%22Three%20Lions%22','en-GB','GB')]},
    {name:'Guardian',    urls:['https://www.theguardian.com/football/rss']},
    {name:'BBC',         urls:['https://feeds.bbci.co.uk/sport/football/rss.xml']},
    {name:'Sky',         urls:['https://www.skysports.com/rss/12040']},
    {name:'Independent', urls:['https://www.independent.co.uk/sport/football/rss']},
  ]},
  { label:'SPA MEDIEN', feeds:[
    {name:'GoogleNews',  urls:[GN('Mundial%202026%20OR%20seleccion','es','ES')]},
    {name:'Marca',       urls:['https://e00-marca.uecdn.es/rss/portada.xml']},
    {name:'AS',          urls:['https://feeds.as.com/mrss-s/pages/as/site/as.com/section/futbol/portada/']},
    {name:'MundoDep.',   urls:['https://www.mundodeportivo.com/feed/rss/home']},
  ]},
  { label:'ITA MEDIEN', feeds:[
    {name:'GoogleNews',  urls:[GN('Mondiale%202026%20OR%20Nazionale','it','IT')]},
    {name:'Gazzetta',    urls:['https://www.gazzetta.it/rss/home.xml']},
    {name:'Corriere',    urls:[GN('site:corrieredellosport.it','it','IT')]},
    {name:'Tuttosport',  urls:[GN('site:tuttosport.com','it','IT')]},
  ]},
  { label:'FR MEDIEN', feeds:[
    {name:'GoogleNews',  urls:[GN('Coupe%20du%20Monde%202026%20OR%20Bleus','fr','FR')]},
    {name:'L\'Équipe',   urls:['https://dwh.lequipe.fr/api/edito/rss?path=/Football/']},
    {name:'FranceInfo',  urls:['https://www.francetvinfo.fr/sports.rss']},
    {name:'Figaro',      urls:['https://www.lefigaro.fr/rss/figaro_sport.xml']},
  ]},
];

COLUMNS.forEach(c => c.feeds.forEach(f => { f.items=[]; f.done=false; }));
const allFeeds = COLUMNS.flatMap(c => c.feeds);
let loadedCount = 0;

setInterval(()=>{
  const n=new Date(), p=x=>String(x).padStart(2,'0');
  document.getElementById('clock').textContent = `${p(n.getHours())}:${p(n.getMinutes())}:${p(n.getSeconds())} MEZ`;
},1000);

function parseXML(xml){
  try{
    const doc = new DOMParser().parseFromString(xml,'text/xml');
    return [...doc.querySelectorAll('item,entry')].slice(0,40).map(el=>{
      const title = el.querySelector('title')?.textContent?.trim() || '';
      const link  = el.querySelector('link')?.textContent?.trim() || el.querySelector('link')?.getAttribute('href') || '#';
      const pub   = el.querySelector('pubDate,published,updated,date')?.textContent?.trim() || '';
      return {title, link, pub, date: pub ? new Date(pub) : new Date(0)};
    }).filter(i=>i.title.length>3);
  }catch(e){ return []; }
}

async function tryUrl(url){
  try{ const r=await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,{signal:AbortSignal.timeout(14000)});
    if(r.ok){ const it=parseXML(await r.text()); if(it.length) return it; } }catch(e){}
  try{ const r=await fetch(url,{signal:AbortSignal.timeout(9000)});
    if(r.ok){ const it=parseXML(await r.text()); if(it.length) return it; } }catch(e){}
  try{ const r=await fetch(`https://corsproxy.io/?${encodeURIComponent(url)}`,{signal:AbortSignal.timeout(11000)});
    if(r.ok){ const it=parseXML(await r.text()); if(it.length) return it; } }catch(e){}
  return null;
}
async function fetchFeed(urls){
  for(const u of urls){ const it = await tryUrl(u); if(it && it.length) return it; }
  return null;
}

// Alle Feeds einer Spalte zu einem Strom mischen (chronologisch, dedupliziert)
function mergedItems(col){
  const seen = new Set();
  const out = [];
  col.feeds.forEach(f => f.items.forEach(i => {
    const key = i.title.toLowerCase().slice(0,60);
    if(seen.has(key)) return;
    seen.add(key);
    out.push({...i, src:f.name});
  }));
  out.sort((a,b)=>b.date-a.date);
  return out.slice(0,80);
}

function render(){
  const q = (document.getElementById('search-box')?.value || '').toLowerCase().trim();
  document.getElementById('columns').innerHTML = COLUMNS.map(col=>{
    let items = mergedItems(col);
    if(q) items = items.filter(i=>i.title.toLowerCase().includes(q));
    const allDone = col.feeds.every(f=>f.done);
    const body =
      items.length ? items.map(i=>`<a class="item" href="${i.link}" target="_blank" rel="noopener">
          <div class="item-src">${esc(i.src)} <span class="ago">· ${timeAgo(i.date)}</span></div>
          <div class="item-title">${esc(i.title)}</div></a>`).join('')
      : allDone ? `<div class="col-msg" style="animation:none;color:#503030;">Nicht verfügbar</div>`
      : `<div class="col-msg">⟳ lädt…</div>`;
    return `<div class="col"><div class="col-head"><span class="col-name">${esc(col.label)}</span><span class="col-count">${items.length||''}</span></div><div class="col-items">${body}</div></div>`;
  }).join('');
}

async function loadFeed(feed){
  try{
    const items = await fetchFeed(feed.urls);
    feed.items = (items && items.length) ? items : [];
  }catch(e){ feed.items = []; }
  feed.done = true;
  loadedCount++;
  const ok = allFeeds.filter(f=>f.items.length).length;
  document.getElementById('load-status').textContent =
    loadedCount<allFeeds.length ? `${loadedCount}/${allFeeds.length}…` : `✓ ${ok}/${allFeeds.length} Quellen`;
  render();
}

async function refreshAll(){
  loadedCount=0;
  allFeeds.forEach(f=>{f.items=[];f.done=false;});
  render();
  await Promise.allSettled(allFeeds.map(loadFeed));
}

refreshAll();
setInterval(refreshAll, 300000);

function timeAgo(d){
  if(!d||!(d instanceof Date)||isNaN(d.getTime())) return '';
  const m=Math.floor((Date.now()-d.getTime())/60000);
  if(isNaN(m)||m<0) return '';
  if(m<2) return 'gerade eben';
  if(m<60) return `vor ${m} Min.`;
  if(m<1440) return `vor ${Math.floor(m/60)} Std.`;
  return `vor ${Math.floor(m/1440)} Tg.`;
}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
</script>
</body>
</html>
